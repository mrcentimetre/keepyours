[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["*"]

# random sequences of calls, per docs/TESTING.md
[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
arbitrum_one = "${ARBITRUM_RPC}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC}"

[etherscan]
arbitrum_one = { key = "${ARBISCAN_API_KEY}", chain = 42161 }
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
